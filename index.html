<!-- 1. Подключаем Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // Твой личный конфиг из скриншота
  const firebaseConfig = {
    apiKey: "AIzaSyAuZJuo2xQ0lcwycZGAKsqEjatkTPizi6U",
    authDomain: "rastessreviews.firebaseapp.com",
    projectId: "rastessreviews",
    storageBucket: "rastessreviews.firebasestorage.app",
    messagingSenderId: "520535485402",
    appId: "1:520535485402:web:37cddbbeb541f942922ee3",
    measurementId: "G-9LKHYFMRSN"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // Элементы интерфейса
  const reviewList = document.getElementById('reviews-list');
  const authBtn = document.getElementById('auth-btn');
  const reviewForm = document.getElementById('review-form');
  let currentUser = null;

  // Твоя почта (чтобы у тебя была кнопка УДАЛИТЬ под всеми отзывами)
  const adminEmail = "ТВОЯ_ПОЧТА@gmail.com"; 

  // Вход / Выход
  authBtn.onclick = () => {
    if (!currentUser) {
      signInWithPopup(auth, provider).catch(err => alert("Ошибка входа: " + err.message));
    } else {
      signOut(auth);
    }
  };

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    authBtn.innerText = user ? `Выйти (${user.displayName})` : "+ Оценить игру";
    reviewForm.style.display = user ? "block" : "none";
  });

  // Отправка отзыва
  window.submitReview = async () => {
    const text = document.getElementById('rev-text').value;
    const stars = document.getElementById('rev-stars').value;
    
    if (!text.trim()) return alert("Напишите текст отзыва");

    try {
      await addDoc(collection(db, "reviews"), {
        uid: currentUser.uid,
        name: currentUser.displayName,
        text: text,
        stars: parseInt(stars),
        time: serverTimestamp()
      });
      document.getElementById('rev-text').value = "";
    } catch (e) {
      alert("Ошибка базы данных. Проверь вкладку Rules в Firebase!");
    }
  };

  // Удаление отзыва
  window.deleteReview = async (id) => {
    if (confirm("Удалить этот отзыв?")) {
      await deleteDoc(doc(db, "reviews", id));
    }
  };

  // Загрузка отзывов в реальном времени
  const q = query(collection(db, "reviews"), orderBy("time", "desc"));
  onSnapshot(q, (snapshot) => {
    reviewList.innerHTML = "";
    snapshot.forEach((res) => {
      const data = res.data();
      // Ты можешь удалять чужие, а игроки - только свои
      const canDelete = currentUser && (currentUser.uid === data.uid || currentUser.email === adminEmail);
      
      reviewList.innerHTML += `
        <div class="review-card" style="background: #16191e; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2a2e35;">
          <div style="display:flex; justify-content: space-between;">
            <span style="font-weight:700;">${data.name}</span>
            <span style="color: #fbbf24;">${"★".repeat(data.stars)}${"☆".repeat(5-data.stars)}</span>
          </div>
          <p style="font-size:14px; color: #9ca3af; margin: 10px 0;">${data.text}</p>
          ${canDelete ? `<button onclick="deleteReview('${res.id}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:12px; padding:0;">Удалить отзыв</button>` : ""}
        </div>
      `;
    });
  });
</script>

<!-- Стили для формы -->
<style>
    #review-form { background: #16191e; padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #2a2e35; }
    #rev-text { width: 100%; background: #0b0c0f; border: 1px solid #2a2e35; color: white; padding: 10px; border-radius: 8px; margin: 10px 0; box-sizing: border-box; }
    .btn-send { background: #007aff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-send:hover { background: #0056b3; }
</style>

<!-- Секция отзывов на странице -->
<div class="reviews-section" style="margin: 60px 10%;">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Отзывы игроков</h2>
        <button id="auth-btn" style="background: none; border: 1px solid #2a2e35; color: white; padding: 10px; border-radius: 8px; cursor: pointer;">
            Загрузка...
        </button>
    </div>

    <div id="review-form" style="display:none;">
        <div style="font-size: 14px; color: #9ca3af;">
            Ваша оценка: 
            <select id="rev-stars" style="background: #0b0c0f; color: white; border: 1px solid #2a2e35; padding: 5px; border-radius: 4px;">
                <option value="5">5 звезд (Отлично)</option>
                <option value="4">4 звезды (Хорошо)</option>
                <option value="3">3 звезды (Средне)</option>
                <option value="2">2 звезды (Плохо)</option>
                <option value="1">1 звезда (Ужасно)</option>
            </select>
        </div>
        <textarea id="rev-text" rows="3" placeholder="Что вы думаете о RASTESS?"></textarea>
        <button class="btn-send" onclick="submitReview()">Опубликовать отзыв</button>
    </div>

    <div id="reviews-list">
        <p style="color: #444;">Загрузка отзывов...</p>
    </div>
</div>
