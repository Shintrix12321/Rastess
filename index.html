<!-- Подключаем Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // !!! ВСТАВЬ СВОЙ КОНФИГ ИЗ ШАГА 1 ТУТ !!!
  const firebaseConfig = {
    apiKey: "ТВОЙ_API_KEY",
    authDomain: "ТВОЙ_PROJECT.firebaseapp.com",
    projectId: "ТВОЙ_PROJECT_ID",
    storageBucket: "ТВОЙ_PROJECT.appspot.com",
    messagingSenderId: "ID",
    appId: "APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // --- ЛОГИКА ИНТЕРФЕЙСА ---
  const reviewList = document.getElementById('reviews-list');
  const authBtn = document.getElementById('auth-btn');
  const reviewForm = document.getElementById('review-form');
  let currentUser = null;

  // Авторизация
  authBtn.onclick = () => {
    if (!currentUser) {
      signInWithPopup(auth, provider);
    } else {
      signOut(auth);
    }
  };

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    authBtn.innerText = user ? `Выйти (${user.displayName})` : "+ Оценить игру";
    reviewForm.style.display = user ? "block" : "none";
  });

  // Отправка отзыва
  window.submitReview = async () => {
    const text = document.getElementById('rev-text').value;
    const stars = document.getElementById('rev-stars').value;
    
    if (!text) return alert("Напишите текст отзыва");

    await addDoc(collection(db, "reviews"), {
      uid: currentUser.uid,
      name: currentUser.displayName,
      text: text,
      stars: parseInt(stars),
      time: serverTimestamp()
    });
    
    document.getElementById('rev-text').value = "";
  };

  // Удаление (только для владельца или автора)
  window.deleteReview = async (id) => {
    if (confirm("Удалить этот отзыв?")) {
      await deleteDoc(doc(db, "reviews", id));
    }
  };

  // Загрузка отзывов в реальном времени
  const q = query(collection(db, "reviews"), orderBy("time", "desc"));
  onSnapshot(q, (snapshot) => {
    reviewList.innerHTML = "";
    snapshot.forEach((res) => {
      const data = res.data();
      const isOwner = currentUser && (currentUser.uid === data.uid || currentUser.email === "ТВОЙ_EMAIL@gmail.com");
      
      reviewList.innerHTML += `
        <div class="review-card">
          <div class="rev-header">
            <span style="font-weight:700;">${data.name}</span>
            <span class="stars">${"★".repeat(data.stars)}${"☆".repeat(5-data.stars)}</span>
          </div>
          <p style="font-size:14px; color: #9ca3af;">${data.text}</p>
          ${isOwner ? `<button onclick="deleteReview('${res.id}')" style="background:none; border:none; color:red; cursor:pointer; font-size:12px;">Удалить</button>` : ""}
        </div>
      `;
    });
  });
</script>

<style>
    /* Стили для формы */
    #review-form { 
        background: #16191e; padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #2a2e35;
    }
    textarea { 
        width: 100%; background: #0b0c0f; border: 1px solid #2a2e35; color: white; padding: 10px; border-radius: 8px; margin: 10px 0;
    }
    select { background: #0b0c0f; color: white; border: 1px solid #2a2e35; padding: 5px; border-radius: 4px; }
    .btn-send { background: #007aff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
</style>

<!-- ГДЕ ВЫВОДИТЬ НА СТРАНИЦЕ -->
<div class="reviews-section">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Отзывы игроков</h2>
        <button id="auth-btn" style="background: none; border: 1px solid #2a2e35; color: white; padding: 10px; border-radius: 8px; cursor: pointer;">
            + Оценить игру
        </button>
    </div>

    <!-- Форма (скрыта по умолчанию) -->
    <div id="review-form" style="display:none;">
        <div style="margin-bottom: 10px;">
            Рейтинг: 
            <select id="rev-stars">
                <option value="5">5 звезд</option>
                <option value="4">4 звезды</option>
                <option value="3">3 звезды</option>
                <option value="2">2 звезды</option>
                <option value="1">1 звезда</option>
            </select>
        </div>
        <textarea id="rev-text" placeholder="Поделитесь вашим мнением об игре..."></textarea>
        <button class="btn-send" onclick="submitReview()">Опубликовать</button>
    </div>

    <!-- Список отзывов из базы -->
    <div id="reviews-list">
        <p style="color: #444;">Загрузка отзывов...</p>
    </div>
</div>
